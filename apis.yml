aid: cobalt-ai
name: Cobalt AI
description: >-
  Cobalt AI (formerly Cobalt Robotics) is a San Francisco based physical
  security automation company whose Cobalt Monitoring Intelligence platform uses
  AI handlers to investigate security events across access control systems and
  video feeds, determine root cause, and trigger automated responses so security
  teams focus on genuine threats instead of alarm triage. Its offerings include
  the Cobalt Command Center remote monitoring service and an indoor autonomous
  security robot, with integrations spanning LenelS2, Genetec, Avigilon, Brivo,
  Eagle Eye Networks, Milestone, Okta, ServiceNow, Salesforce, and Slack. The
  company was founded in 2016, backed early by Bloomberg Beta and Sequoia, and
  acquired in 2024 by Dean Drako, who rebranded it to Cobalt AI.
